spring.datasource.url=jdbc:mysql://localhost:3306/coconut_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# CORS - allowed frontend origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Show full error messages in response
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on-param

# Fix MySQL dialect warning
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart file sizes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# External APIs
weather.api.key=${WEATHER_API_KEY:}
news.api.key=${NEWS_API_KEY:}

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.coconutfarming=DEBUG

# Email (SMTP) for verification emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URLs used in email links
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000

# Google Authentication
google.client.id=${GOOGLE_CLIENT_ID:}